version: '3.8'

services:
  uploader:
    build: .
    container_name: tg-music-uploader
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Portainer will fill this in from the Environment variables section
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Timezone set to Tehran for accurate daily reset limits
      - TZ=Asia/Tehran
    volumes:
      # Maps to the data folder you created on your VPS
      - /opt/tg-music-uploader/data:/data
      # Maps to the music folder you created on your VPS (Read-Only)
      - /opt/tg-music-uploader/music:/music:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
